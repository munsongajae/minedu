<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단어 게임 · 곰이난이 블록 스튜디오</title>
<meta name="theme-color" content="#4c8a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Jua&family=Silkscreen&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="turf" aria-hidden="true"></div>
<div class="wrap">
  <nav class="topnav" aria-label="메뉴">
    <a href="./">만들기</a>
    <a href="practice.html">문장 연습</a>
    <a href="words.html" aria-current="page">단어 게임</a>
  </nav>
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Word games · 내 문장 속 단어</div>
      <h1>단어 게임</h1>
    </div>
    <div id="kidPick"></div>
  </header>

  <section class="learn-home" id="home">
    <p class="who" id="who">누가 하나요? 위에서 이름을 눌러 주세요.</p>
    <div class="stats" id="stats"></div>
    <div class="row learn-filter">
      <label class="lab" for="proj">어떤 영상 단어로 할까요?</label>
      <select id="proj"></select>
    </div>
    <div class="game-pick" role="group" aria-label="게임 고르기">
      <button type="button" class="gp" data-kind="match">
        <b>짝 맞추기</b><span>영어 카드와 한글 카드의 짝을 찾아요</span>
      </button>
      <button type="button" class="gp" data-kind="quiz">
        <b>보고 고르기</b><span>뜻이나 단어를 보고 맞는 것을 골라요</span>
      </button>
    </div>
    <div class="row level" role="group" aria-label="카드 수" id="matchOpts">
      <span class="lab">카드</span>
      <button type="button" class="lvl" data-pairs="4">4쌍 (쉬움)</button>
      <button type="button" class="lvl" data-pairs="6">6쌍 (보통)</button>
      <button type="button" class="lvl" data-pairs="8">8쌍 (어려움)</button>
    </div>
    <div class="row level" role="group" aria-label="문제 방향" id="quizOpts" hidden>
      <span class="lab">문제</span>
      <button type="button" class="lvl" data-dir="ko2en">한글 보고 영어 고르기</button>
      <button type="button" class="lvl" data-dir="en2ko">영어 보고 한글 고르기</button>
      <button type="button" class="lvl" data-dir="mix">섞어서</button>
    </div>
    <div class="row">
      <button class="btn big grass" id="start" type="button" disabled>게임 시작</button>
    </div>
    <p class="note" id="homeNote" role="status"></p>
    <details class="sent-list">
      <summary>내 단어장 보기</summary>
      <ul class="word-list" id="wordList"></ul>
    </details>
  </section>

  <section class="game" id="game" hidden>
    <div class="session-top">
      <span class="count" id="found"></span>
      <span class="count" id="moves"></span>
      <span class="count" id="clock"></span>
      <button class="btn small" id="quit" type="button">그만하기</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section class="quiz" id="quiz" hidden>
    <div class="session-top">
      <span class="count" id="qCount"></span>
      <span class="count" id="qScore"></span>
      <div class="bar" aria-hidden="true"><i id="qFill"></i></div>
      <button class="btn small" id="qQuit" type="button">그만하기</button>
    </div>
    <article class="qcard">
      <p class="q-label" id="qLabel"></p>
      <div class="q-prompt-row">
        <p class="q-prompt" id="qPrompt"></p>
        <button class="btn small listen" type="button" id="qSay" hidden>다시 듣기</button>
      </div>
      <div class="q-opts" id="qOpts"></div>
      <p class="pfb" id="qFb" role="status"></p>
      <div class="row" id="qNextRow" hidden><button class="btn big grass" type="button" id="qNext">다음 →</button></div>
    </article>
  </section>

  <section class="done" id="done" hidden>
    <h2 id="doneTitle">다 찾았어요!</h2>
    <p id="doneText"></p>
    <div class="row">
      <button class="btn big grass" id="again" type="button">한 판 더</button>
      <button class="btn big" id="home2" type="button">처음으로</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="js/words.js"></script>
</body>
</html>
